<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maison sonore</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <main class="app">

    <header class="hero">
      <div>
        <p class="eyebrow">Raspberry Pi local</p>
        <h1>Maison sonore</h1>
        <p class="dashboard-sub">Choisis une sous-application</p>
      </div>
      <div class="pill">LAN</div>
    </header>

    <section class="home-grid">

      <a id="homeTileAlarm" class="app-tile" href="/alarm" data-home-app="alarm">
        <span class="app-icon">
          <span class="app-icon-symbol">⏰</span>
          <span class="icon-waveform mini-waveform hidden" aria-hidden="true"></span>
        </span>
        <span class="app-title">Réveil</span>
        <span class="app-sub"></span>
      </a>

      <a id="homeTileRadio" class="app-tile" href="/radio" data-home-app="radio">
        <span class="app-icon">
          <span class="app-icon-symbol">📻</span>
          <span class="icon-waveform mini-waveform hidden" aria-hidden="true"></span>
        </span>
        <span class="app-title">Radio</span>
        <span class="app-sub"></span>
      </a>

      <a id="homeTileLights" class="app-tile disabled" href="#" data-home-app="lights">
        <span class="app-icon">
          <span class="app-icon-symbol">💡</span>
          <span class="icon-waveform mini-waveform hidden" aria-hidden="true"></span>
        </span>
        <span class="app-title">Lumière</span>
        <span class="app-sub"></span>
      </a>

      <a id="homeTilePlayer" class="app-tile" href="/player" data-home-app="player">
        <span class="app-icon">
          <span class="app-icon-symbol">🎧</span>
          <span class="icon-waveform mini-waveform hidden" aria-hidden="true"></span>
        </span>
        <span class="app-title">Lecteur</span>
        <span class="app-sub"></span>
      </a>

      <a id="homeTileConfig" class="app-tile disabled" href="#" data-home-app="config">
        <span class="app-icon">
          <span class="app-icon-symbol">⚙️</span>
          <span class="icon-waveform mini-waveform hidden" aria-hidden="true"></span>
        </span>
        <span class="app-title">Config Pi</span>
        <span class="app-sub"></span>
      </a>

    </section>

    <footer>
      tu peux toujours rêver
    </footer>

  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
