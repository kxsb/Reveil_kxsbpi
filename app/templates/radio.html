<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radio Pi</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="page-module page-radio">
  <main class="app">

    <header class="hero">
      <div>
        <p class="eyebrow">Radio locale</p>
        <h1>📻 Radio Pi</h1>
      </div>
      <a class="pill home-link" href="/">Accueil</a>
    </header>

    <section id="radioDashboard" class="dashboard radio-dashboard" role="button" tabindex="0" aria-label="Choisir une station">
      <p class="dashboard-label" id="dashboardLabel">Lecture radio</p>

      <div id="dashboardTime" class="dashboard-time" data-default="Aucune station">
        Aucune station
      </div>

      <p id="dashboardSub" class="dashboard-sub" data-default="Choisis une station">
        Choisis une station
      </p>

      <div id="liveWaveform" class="live-waveform hidden" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i>
      </div>

      <div id="fadeGraph" class="fade-graph hidden">
        <svg viewBox="0 0 100 60">
          <path id="fadeCurvePath"></path>
          <circle id="fadeDot" r="3"></circle>
        </svg>
        <p id="fadeGraphLabel"></p>
      </div>

      <div id="radioMenu" class="radio-menu radio-menu-in-card hidden"></div>
    </section>

    <section class="actions">
      <p id="actionStatus" class="small action-status"></p>
<form action="/stop" method="post" class="js-stop-form hidden">
        <button class="action danger" type="submit">⏹ Stop</button>
      </form>
    </section>

    <footer class="footer-signature">
      tu peux toujours rêver
    </footer>

  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
