<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Config Pi</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="page-module page-config">
  <main class="app">

    <header class="hero">
      <div>
        <p class="eyebrow">Config locale</p>
        <h1>⚙️ Config Pi</h1>
      </div>
      <a class="pill home-link" href="/">Accueil</a>
    </header>

    <section class="dashboard config-dashboard">
      <p class="dashboard-label">Système</p>

      <div class="dashboard-time config-title">
        Raspberry Pi
      </div>

      <p class="dashboard-sub">
        État local
      </p>

      <button id="systemOverviewButton" class="action secondary-action system-overview-button" type="button">
        Aperçu du système
      </button>

      <div id="systemOverviewPanel" class="system-overview hidden" aria-live="polite"></div>

      <button id="playlistManagerButton" class="action secondary-action playlist-manager-button" type="button">
        Gestion des playlists
      </button>

      <div id="playlistManagerPanel" class="playlist-manager hidden" aria-live="polite">
        <div id="playlistList" class="playlist-list"></div>

        <form id="playlistForm" class="playlist-form">
          <input name="playlist_id" placeholder="id, ex: chill" autocomplete="off" required>
          <input name="label" placeholder="nom affiché" autocomplete="off" required>
          <input name="url" placeholder="URL YouTube playlist" inputmode="url" autocomplete="off" required>
          <button class="action" type="submit">Ajouter</button>
        </form>
      </div>
    </section>

    <p id="actionStatus" class="small action-status"></p>

    <footer class="footer-signature">
      tu peux toujours rêver
    </footer>

  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
